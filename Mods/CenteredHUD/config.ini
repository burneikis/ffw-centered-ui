; CenteredHUD config. Press F8 in game to reload.
; Offsets are DPI-scaled units from the screen center (crosshair).
; Align: which point of the element sits at center+offset. 0 = left/top, 0.5 = middle, 1 = right/bottom.
Enabled=1

; Spell cooldowns (SpellA/B/C)
SpellsX=-70
SpellsY=0
SpellsAlignX=1
SpellsAlignY=0.5
SpellsScale=0.9
; row alignment inside the box: 1 left, 2 center, 3 right
SpellsRowAlign=3
; 1 = move spells out of the RetainerBox (fixes ghost rows). Offsets are then raw pixels, not DPI-scaled.
SpellsOutsideRetainer=1

; Ammo counter (number + weapon icon)
AmmoX=70
AmmoY=0
AmmoAlignX=0
AmmoAlignY=0.5
AmmoScale=0.9
