; CenteredHUD config. Press F8 in game to reload and re-apply.
;
; Every [Section] (except [General]) describes one HUD element to move.
; Add, remove or duplicate sections freely; the section name is only a label.
;
; Keys per section:
;   Widget    = widget name in the HUD tree (required, e.g. HB_Spells)
;   Enabled   = 1/0, skip this section when 0
;   X, Y      = offset from screen center, in pixels
;   AlignX/Y  = which point of the element sits at center+offset
;               0 = left/top, 0.5 = middle, 1 = right/bottom
;   Scale     = render scale (1 = original size)
;   ZOrder    = draw order, higher = on top
;   Reparent  = none   keep current parent (offsets are DPI-scaled units)
;               canvas move into MovingCanvas (DPI-scaled units)
;               outer  move next to the crosshair, outside RetainerBox_0
;                      (fixes ghost rows; offsets become raw pixels)
;               auto   reparent into MovingCanvas only if not already
;                      in a canvas slot
;   RowAlign  = horizontal alignment of child rows: -1 leave alone,
;               0 fill, 1 left, 2 center, 3 right
;   ResetChildOffsets = 1 clears per-child render translation (spell stagger)

[General]
Enabled=1
; Print a line to the UE4SS console for each applied element.
Verbose=1

[Spells]
Widget=HB_Spells
Enabled=1
X=-70
Y=0
AlignX=1
AlignY=0.5
Scale=0.9
Reparent=outer
RowAlign=3
ResetChildOffsets=1

[Ammo]
Widget=HB_Ammo
Enabled=1
X=70
Y=0
AlignX=0
AlignY=0.5
Scale=0.9
Reparent=auto

; Example: uncomment to also pull the health bar near the crosshair.
